# Autostart
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
exec-once=fcitx5-remote -r
exec-once=fcitx5 -d --replace
exec-once=fcitx5-remote -r

env = GBM_BACKEND,nvidia-drm
# Sourcing external config files
source= keybinds.conf
source= startup.conf
source= Laptops.conf # For laptop related
source= decorations.conf # Decorations and animations config file
source= settings.conf # Main Hyprland Settings.
source= defaults.conf # defaults apps
source= wrules.conf # window rules

# system environment variables
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_SCALE,1
env = QT_SCALE_FACTOR,1
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto # for electron apps
env = GBM_BACKEND,nvidia-drm
env = WLR_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
# Force Mesa driver backend
env = LIBGL_ALWAYS_SOFTWARE,0
env = WLR_NO_HARDWARE_CURSORS,1

# For Dual GPU (Intel + NVIDIA)
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

# Disable forcing linear modifiers on Multi-GPU buffers (may help Nvidia issues)
env = AQ_FORCE_LINEAR_BLIT,0

# Disable explicit syncing on multi-GPU buffers
env = AQ_MGPU_NO_EXPLICIT,1
# LAYER RULES
# layerrule = blur, rofi
# layerrule = ignorezero, rofi
# layerrule = blur, notifications
# layerrule = ignorezero, notifications
# and ends here
render {
    direct_scanout = false
}
